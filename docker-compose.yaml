services:
  redis_db:
    image: redis
    container_name: redis_db
    networks:
      - private

  mysql_db:
    image: mysql:8.4
    container_name: mysql_db
    ports:
      - '3306:3306'
    networks:
      - private
    environment:
      MYSQL_ROOT_PASSWORD: ${DOCKER_MYSQL_PASSWORD}
    volumes:
      - mysql_ultra_vol:/var/lib/mysql

  api:
    build:
      context: .
      dockerfile: ./run_api/dockerfile
    container_name: api
    ports:
      - '3000:5000'
    networks:
      - private
    depends_on:
      - mysql_db
      - redis_db
    restart: no

  feed:
    build:
      context: .
      dockerfile: ./feed/dockerfile
    container_name: feed
    networks:
      - private
    depends_on:
      - api
    restart: no
  
  logs:
    build:
      context: .
      dockerfile: ./backlogs/dockerfile
    container_name: logs
    networks:
      - private
    depends_on:
      - api
    restart: no
  
  bot:
    build:
      context: .
      dockerfile: ./run_bot/dockerfile
    container_name: bot
    networks:
      - private
    depends_on:
      - logs
      - feed
    restart: no
    
networks:
  private:
    driver: bridge

volumes:
  mysql_ultra_vol: